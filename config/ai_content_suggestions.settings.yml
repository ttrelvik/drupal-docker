_core:
  default_config_hash: qgvkQXIbpBNBsbs1QpPWaiBwLuQggFrGaTq6n2i6RlA
field_widget_prompt: "You will be asked to help with content suggestions based on the input in markdown format. Answer with\r\nsuggestions only, do not repeat the task description, do not use any other text except for the suggestions.\r\nDo not include any explanations, only provide a RFC8259 compliant JSON response following this format without deviation:\r\n```\r\n[\r\n  {\"suggestion\": \"First suggested text\"},\r\n  {\"suggestion\": \"Second suggested text\"},\r\n]\r\n```\r\nIf you are enable to generate a response, respond with \"Insufficient information provided, please add more data before generating suggestions.\"\r\n"
plugins:
  readability:
    enabled: true
    model: openai__gpt-4o-mini
    prompt: "Provide a Flesch score of the following text as well as one sentence description of how that score should be interpreted.\r\n      Afterward, provide a brief list of suggested improvements to enhance readability, focusing on sentence length, word complexity, and overall structure.\r\n      Return it like so (in html), don't answer with other things than the score, the brief explanation and suggestions. no pleasantries or greetings.\r\n      Always answer in the following output format:\r\n````\r\n<p class=\"score\">\r\n<b>Score</b>: SCORE<br>\r\n<b>Explanation</b>: ONE SENTENCE TO EXPLAIN<br>\r\n<b>Suggestions</b>: <ul><li>SUGGESTION 1</li></ul>\r\n</p>\r\n````\r\n\r\n    Apart form the formatted output, return nothing else.\r\n\r\n      The input text:\r\n"
  summarise:
    enabled: true
    model: openai__gpt-4o-mini
    prompt: "Create a detailed summary of the following text in less than 130 words using the same language as the following text:\r\n"
  taxonomy_suggest:
    enabled: true
    model: openai__gpt-4o-mini
    prompt_open: suggest_tags__suggest_tags_default
    prompt_from_voc: suggest_vocabulary__suggest_vocabulary_default
  title_suggest:
    enabled: true
    model: openai__gpt-4o-mini
    prompt: "Suggest an SEO friendly title for this page based off of the following content in 10 words or less, in the same language as the input:\r\n"
entity_types:
  block_content:
    bundles: {  }
    mode: disable
  node:
    bundles: {  }
    mode: disable
  taxonomy_term:
    bundles: {  }
    mode: disable
